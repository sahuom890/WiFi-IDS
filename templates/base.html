<!-- 
  base.html — Shared layout for the Wi-Fi IDS application.
  Provides the navigation bar, footer, and content block.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wi-Fi Intrusion Detection and Investigation System — real-time monitoring, attack detection, and forensic logging.">
    <title>{% block title %}Wi-Fi IDS{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Google Font — Share Tech Mono for cybersecurity aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== Scan-line overlay for CRT effect ===== -->
    <div class="scanline-overlay"></div>

    <!-- ===== Navigation ===== -->
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">&#9776;</span>
            <span class="brand-text">Wi-Fi<span class="accent"> IDS</span></span>
        </div>
        <ul class="nav-links">
            <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a></li>
            <li><a href="/dashboard" class="{% if request.path == '/dashboard' %}active{% endif %}">Dashboard</a></li>
            <li><a href="/logs" class="{% if request.path == '/logs' %}active{% endif %}">Logs</a></li>
        </ul>
        <div class="nav-status" id="nav-status">
            <span class="status-dot offline" id="nav-dot"></span>
            <span id="nav-status-text">Offline</span>
        </div>
    </nav>

    <!-- ===== Main Content ===== -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- ===== Footer ===== -->
    <footer class="footer">
        <p>&copy; 2026 Wi-Fi Intrusion Detection &amp; Investigation System &mdash; Academic Demonstration</p>
    </footer>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
